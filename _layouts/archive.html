---
layout: default
---
{% include base_path %}

<div id="main" role="main" class="page-grid">
  {% if page.author_profile or layout.author_profile %}
    <aside class="sidebar">
      {% include author-profile.html %}
    </aside>
  {% endif %}

  <div class="archive">
    {% if page.title %}
      <header class="page__header">
        <h1 class="page__title">{{ page.title }}</h1>
      </header>
    {% endif %}
    <div class="archive__content">
      {{ content }}
    </div>
  </div>
</div>
