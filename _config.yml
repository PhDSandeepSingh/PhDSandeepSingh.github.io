# Site Configuration for Sandeep Singh Academic Portfolio
# Self-Contained AcademicPages Jekyll Configuration

# Site Settings
locale                   : "en-US"
title                    : "Sandeep Singh"
title_separator          : "-"
name                     : &name "Sandeep Singh"
description              : &description "PhD Researcher at the Department of Mathematics, Chandigarh University, specializing in clinical machine learning and environmental spatiotemporal intelligence."
url                      : "https://phdsandeepsingh.github.io"
baseurl                  : "" # Leave empty ("") for user site PhDSandeepSingh/PhDSandeepSingh.github.io
repository               : "PhDSandeepSingh/PhDSandeepSingh.github.io"
teaser                   : # path to default teaser image

# Site Author (Update your personal details and links below)
author:
  name             : "Sandeep Singh"
  avatar           : "PP.PNG" # Reads from /images/PP.PNG or /PP.PNG (falls back to /images/profile.svg if not yet copied)
  bio              : "PhD Researcher & Data Scientist"
  location         : "Mohali, India, 140413"
  employer         : "Department of Mathematics, Chandigarh University"
  uri              : "https://phdsandeepsingh.github.io"
  email            : "" # TODO: e.g. "sandeep@cumail.in"
  github           : "PhDSandeepSingh"
  googlescholar    : "" # TODO: Full URL to your Google Scholar profile
  orcid            : "" # TODO: Full ORCID URL, e.g. "https://orcid.org/0000-0000-0000-0000"
  researchgate     : "" # TODO: Full URL to your ResearchGate profile (optional)
  linkedin         : "" # TODO: LinkedIn username (part after linkedin.com/in/)
  twitter          : "" # TODO: X/Twitter handle without @ (optional)

# GitHub Pages Supported Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-redirect-from

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Markdown & Syntax Highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  math_engine: mathjax

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - Rakefile
  - README
  - README.md
  - files/README.md
  - tmp
  - setup_dirs.py
  - populate_portfolio.py

# Defaults for Frontmatter
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
